name: QSE v148 Bot - tiap candle 4H tutup

on:
  schedule:
    # candle 4H Bybit tutup 00 04 08 12 16 20 UTC, jalan 2 menit sesudahnya
    - cron: "2 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}

concurrency:
  group: qse-bot
  cancel-in-progress: false

jobs:
  scan:
    # runner di VPS kamu, IP GitHub ditolak Bybit
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Jalankan QSE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          QSE_RISK_USDT: ${{ vars.QSE_RISK_USDT }}
          QSE_RAPOR: ${{ vars.QSE_RAPOR }}
          QSE_H1_BARS: ${{ vars.QSE_H1_BARS }}
          QSE_H1_INTRABAR: ${{ vars.QSE_H1_INTRABAR }}
        run: bash run.sh
